# Every check the project has, on every pull request and every push to
# dev, in two jobs that run side by side: `check` (the static checks and
# Vitest) and `e2e` (the production build, its bundle budget and
# Playwright). README.md's "Checks" section says how to run each locally.
name: CI

on:
  pull_request:
  push:
    branches: [dev, fix/T336-ci-for-intone-and-agent-company]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to dev
# gets a group of its own, by its commit: a group holds one running run
# and one pending, and a third run cancels the pending one, which would
# leave that commit on dev with no result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # check took 7.4 minutes and e2e 6.0 in run 43592154312, with the
    # models cached; both jobs get the same limit, which leaves room for
    # a run whose cache misses to fetch all 314 MB of them first.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Model files listed in models.json, whisper-small's 149.5 MiB decoder
      # among them: the tooling tests run the tracker, the cut and the
      # tokeniser on them, and build the app. The cache is content-addressed,
      # so an older one is a safe start: only a file it lacks is fetched.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: models-${{ hashFiles('models.json') }}
          restore-keys: models-

      - name: Fetch and check the model files
        run: npm run fetch:models

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Effect check
        run: npm run check:effect

      - name: Generated files are current
        run: npm run generate:check

      - name: Unit, Story and Scene tests
        run: npm test

  e2e:
    runs-on: ubuntu-24.04
    # check took 7.4 minutes and e2e 6.0 in run 43592154312, with the
    # models cached; both jobs get the same limit, which leaves room for
    # a run whose cache misses to fetch all 314 MB of them first.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same cache as the check job's: the build copies the models
      # into dist/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: models-${{ hashFiles('models.json') }}
          restore-keys: models-

      - name: Fetch and check the model files
        run: npm run fetch:models

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:budget

      # Not cached: the install took 8 s in run 43463149824, about what
      # restoring a cache of it takes. The runner image has Chromium's
      # system libraries, so it needs no --with-deps.
      - name: Install Chromium
        run: npx playwright install chromium

      # Against the build above: `npm run test:e2e` would build again.
      - name: End-to-end tests
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
